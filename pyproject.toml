[project]
name = "finsearch"
version = "0.1.0"
description = "Hybrid search + RAG over Swiss/US financial documents"
requires-python = ">=3.11"
dependencies = [
  "elasticsearch>=9.4,<9.5",
  "sentence-transformers>=3.0,<6",
  "pymupdf>=1.24",
  "trafilatura>=2.0",
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "langdetect>=1.0.9",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.8",
  "types-PyYAML", "matplotlib>=3.8", "playwright>=1.45",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "E501"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Elasticsearch (docker compose up)", "llm: needs a real LLM key", "e2e: browser smoke test (Playwright chromium + Elasticsearch)"]
addopts = "-m 'not integration and not llm and not e2e'"

[tool.coverage.run]
source = ["src/finsearch"]
