# FinSearch document sources.
#
# Layout: sources.<key> = one source family (key is stored as DocumentMeta.source).
# Per document: url (https only, identity => doc_id = sha256(url)[:16]), title, doc_type
# (speech|annual_report|market_comment|other), lang hint (de|en; the real language is
# detected from the text), date (ISO, optional) and an optional max_pages cap (PDFs only)
# because annual reports are huge.
#
# Every URL below was fetched on 2026-10-21 and returned the expected PDF/HTML.
# robots.txt + terms were read per host (see robots_checked / license_note).
#
# Hosts checked but NOT used:
#   - www.ecb.europa.eu: robots.txt allows it but sets Crawl-delay: 5 -> skipped to stay simple.
#   - sec.gov / imf.org / bankofengland.co.uk: not needed, >= 3 families already covered.
# Nothing here needed a login, a paywall bypass or a bot-challenge workaround.
#
# BIS: 2 speeches are listed as .pdf because the BIS HTML page only shows a short extract.
# SNB speech pages are HTML shells; the speech text lives in the PDF linked from the page,
# so the PDF is listed directly. Two SNB speeches (20260424 Schlegel, 20260826 Martin) are
# listed in de AND en on purpose (translations => cross-lingual retrieval checks).
