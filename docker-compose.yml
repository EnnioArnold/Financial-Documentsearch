# Local dev only: security is disabled and ports are bound to 127.0.0.1. NOT for production.
name: finsearch
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.4.8
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports: ["127.0.0.1:9200:9200"]
    volumes: ["esdata:/usr/share/elasticsearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 40
  kibana:
    image: docker.elastic.co/kibana/kibana:9.4.8
    depends_on:
      elasticsearch: {condition: service_healthy}
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports: ["127.0.0.1:5601:5601"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 5s
      timeout: 10s
      retries: 60
  api:
    build: .
    depends_on:
      elasticsearch: {condition: service_healthy}
    env_file: [{path: .env, required: false}]
    environment:
      - ES_URL=http://elasticsearch:9200
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["hfcache:/root/.cache/huggingface"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 30
  kibana-setup:
    build: .
    depends_on:
      kibana: {condition: service_healthy}
    environment:
      - KIBANA_URL=http://kibana:5601
      - ES_URL=http://elasticsearch:9200
    command: ["python", "observability/setup_kibana.py"]
    restart: "no"
volumes:
  esdata:
  hfcache:
